name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller build_exe.spec

    - name: List build output
      run: |
        dir dist

    - name: Package EXE as base64 text (사내망 반입용)
      run: |
        python scripts/make_txt_package.py dist/KEPCO_RPA.exe dist/txt
        dir dist\txt

    - name: Upload artifact (EXE)
      uses: actions/upload-artifact@v4
      with:
        name: KEPCO_RPA_Windows
        path: |
          dist/KEPCO_RPA.exe
        retention-days: 90

    - name: Upload artifact (base64 txt — 사내망 반입용)
      uses: actions/upload-artifact@v4
      with:
        name: KEPCO_RPA_txt
        path: |
          dist/txt/KEPCO_RPA.txt
          dist/txt/사용법.txt
        retention-days: 90

    - name: Package EXE as PNG image (사내망 반입용)
      run: |
        python scripts/exe_image.py encode dist/KEPCO_RPA.exe dist/KEPCO_RPA.png
        Copy-Item scripts/RESTORE_FROM_IMAGE.txt dist/RESTORE_FROM_IMAGE.txt
        Copy-Item scripts/exe_image.py dist/exe_image.py
        dir dist
      shell: pwsh

    - name: Upload artifact (PNG image — 사내망 반입용)
      uses: actions/upload-artifact@v4
      with:
        name: KEPCO_RPA_image
        path: |
          dist/KEPCO_RPA.png
          dist/exe_image.py
          dist/RESTORE_FROM_IMAGE.txt
        retention-days: 90

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/KEPCO_RPA.exe
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
